# ===== 基础设置 =====
general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = loginctl unlock-session $XDG_SESSION_ID
    before_sleep_cmd = loginctl lock-session $XDG_SESSION_ID
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# ===== 背景 =====
background {
    monitor =
    path = ~/.config/background.jpg
    blur_passes = 0
    blur_size = 0
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ===== 密码输入框 - 缩小适配 =====
input-field {
    monitor =
    size = 220, 50                      # 🔹 原 250×60 → 缩小 12
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(255, 255, 255, 0.05)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##a0a0a0"><i>密码...</i></span>  # 🔹 简化文案
    hide_input = false
    position = 0, -350                   # 🔹 原 -460 → 上移适配 900p
    halign = center
    valign = center
}

# ===== 上次登录信息 =====
label {
    monitor =
    text = cmd[update:3600000] echo "上次登录: $(last -2 $USER | head -2 | tail -1 | awk '{print $4" "$5" "$6" "$7}')"
    color = rgba(200, 200, 200, 0.7)
    font_size = 13                       # 🔹 14px → 13px
    font_family = Inter
    position = 0, -300                   # 🔹 原 -400 → 跟随输入框上移
    halign = center
    valign = center
}

# ===== 时间显示 - 核心视觉 =====
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 95                       # 🔹 125px → 95px (关键调整)
    font_family = Inter
    font_weight = bold
    position = 0, 280                    # 🔹 原 370 → 上移避免贴底
    halign = center
    valign = center
}

# ===== 日期显示 =====
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.75)
    font_size = 20                       # 🔹 25px → 20px
    font_family = Inter
    position = 0, 350                    # 🔹 原 470 → 跟随时间上移
    halign = center
    valign = center
}

# ===== 键盘布局指示器 =====
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.65)
    font_size = 14
    font_family = Inter
    position = 16, -16                   # 🔹 边距微调
    halign = left
    valign = bottom
}

# ===== Caps Lock 状态 =====
label {
    monitor =
    text = $CAPS
    color = rgba(255, 255, 255, 0.65)
    font_size = 14
    font_family = Inter
    position = -16, -16                  # 🔹 边距微调
    halign = right
    valign = bottom
}

